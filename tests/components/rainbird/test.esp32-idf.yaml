substitutions:
  tx_pin: GPIO26
  rx_pin: GPIO27
  rmt_symbols: "384"

packages:
  common: !include common.yaml

esphome:
  name: rainbird-esp32-idf
  min_version: 2026.9.0

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Proves the trigger parameter names compile. The package's on_nak list is replaced.
rainbird:
  experimental: true
  # The hand-written start button below is program C's only one.
  programs:
    - program: C
      start_button: false
      running_binary_sensor: Drip running
  zone_defaults:
    valve_switch: {}
    run_duration_number: {}
    running_binary_sensor:
      name: "{zone} running"
  on_nak:
    - logger.log:
        format: "Controller NAK %u %u"
        args:
          - !lambda static_cast<unsigned>(command)
          - !lambda static_cast<unsigned>(code)
  on_frame:
    - lambda: |-
        ESP_LOGD("rainbird", "frame %u", static_cast<unsigned>(payload.size()));

switch:
  - platform: rainbird
    zone: 4
    valve:
      id: side_path_valve
      name: Side path

number:
  - platform: rainbird
    zone: 4
    run_duration:
      id: side_path_duration
      name: Side path duration

button:
  - platform: rainbird
    program: C
    start:
      id: run_drip
      name: Run drip
  - platform: template
    name: Send model query
    on_press:
      - rainbird.send_raw:
          id: rainbird_controller
          data: [0x02]

# Every read-only status entity (PLAN step S6).
sensor:
  - platform: rainbird
    remaining_time:
      name: Time remaining
    active_zone:
      name: Active zone
    queued_zones:
      name: Zones queued
    response_time:
      name: Controller response time
    link_errors:
      name: Controller link errors

binary_sensor:
  - platform: rainbird
    watering:
      name: Watering
    rain_sensor:
      name: Rain sensor
      filters:
        - invert:
    irrigation_enabled:
      name: Irrigation enabled
    connected:
      name: Controller connected
  - platform: rainbird
    zone: 4
    running:
      name: Side path running

text_sensor:
  - platform: rainbird
    active_program:
      name: Active program
    queue:
      name: Queue
    model:
      name: Controller model
    firmware_version:
      name: Controller firmware
    serial_number:
      name: Controller serial
    schedule_changed:
      name: Schedule last changed
